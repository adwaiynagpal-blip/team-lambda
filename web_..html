<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motor &amp; Brush Controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }

body {
  font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif;
  background: #0d0d0d;
  color: #e8e8e8;
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1.5rem 3rem;
}

h1 {
  font-size: 1.8rem;
  font-weight: 700;
  background: linear-gradient(135deg, #4CAF50, #81C784);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin: 0 0 1.5rem;
  letter-spacing: -0.5px;
}

h2 {
  font-size: 1.05rem;
  font-weight: 600;
  color: #81C784;
  margin: 0 0 0.75rem;
}

.card {
  background: linear-gradient(145deg, #1a1a1a, #161616);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 14px;
  padding: 1.2rem 1.5rem;
  margin: 0.6rem 0;
  max-width: 440px;
  width: 100%;
  box-shadow: 0 4px 24px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.04) inset;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(76,175,80,0.15);
}

label {
  font-size: 0.85rem;
  font-weight: 500;
  color: #aaa;
  display: block;
  margin-bottom: 0.4rem;
  letter-spacing: 0.3px;
}

.speed-val { color: #4CAF50; font-weight: 700; margin-left: 0.25rem; }

.ip-input {
  width: 100%;
  padding: 0.6rem 0.8rem;
  background: #242424;
  color: #eee;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  font-size: 0.95rem;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.ip-input:focus {
  border-color: #4CAF50;
  box-shadow: 0 0 0 3px rgba(76,175,80,0.18);
}

input[type="range"] {
  -webkit-appearance: none;
  width: 100%;
  height: 6px;
  border-radius: 3px;
  background: #2e2e2e;
  outline: none;
  margin: 0.5rem 0 1rem;
  cursor: pointer;
  accent-color: #4CAF50;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: #4CAF50;
  box-shadow: 0 0 6px rgba(76,175,80,0.6);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
input[type="range"]::-webkit-slider-thumb:hover {
  transform: scale(1.2);
  box-shadow: 0 0 10px rgba(76,175,80,0.8);
}

.btn-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.25rem; }

button {
  background: linear-gradient(135deg, #4CAF50, #388E3C);
  color: #fff;
  border: none;
  padding: 0.55rem 1.1rem;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 600;
  font-family: inherit;
  letter-spacing: 0.3px;
  transition: filter 0.18s ease, transform 0.15s ease, box-shadow 0.18s ease;
  box-shadow: 0 2px 8px rgba(76,175,80,0.3);
}
button:hover {
  filter: brightness(1.15);
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(76,175,80,0.45);
}
button:active { transform: translateY(0); filter: brightness(0.95); }

.stop-btn {
  background: linear-gradient(135deg, #f44336, #c62828);
  box-shadow: 0 2px 8px rgba(244,67,54,0.3);
}
.stop-btn:hover { box-shadow: 0 4px 14px rgba(244,67,54,0.5); }

.log {
  background: linear-gradient(145deg, #141414, #111);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 14px;
  padding: 1rem 1.2rem;
  max-width: 440px;
  width: 100%;
  max-height: 220px;
  overflow-y: auto;
  margin-top: 0.6rem;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
.log h2 {
  margin: 0 0 0.6rem;
  font-size: 1rem;
  position: sticky;
  top: 0;
  background: #141414;
  padding-bottom: 0.3rem;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.log-entry {
  font-family: 'Courier New', monospace;
  font-size: 0.85rem;
  margin: 0.25rem 0;
  padding: 0.15rem 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.log::-webkit-scrollbar { width: 5px; }
.log::-webkit-scrollbar-track { background: transparent; }
.log::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
.log::-webkit-scrollbar-thumb:hover { background: #4CAF50; }

.proxy-status {
  max-width: 440px;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 0.55rem;
  font-size: 0.82rem;
  font-weight: 500;
  color: #aaa;
  margin-bottom: 0.3rem;
  padding: 0.55rem 0.9rem;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 10px;
  letter-spacing: 0.2px;
}
.proxy-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: #555;
  flex-shrink: 0;
  transition: background 0.3s;
  box-shadow: 0 0 0 2px rgba(0,0,0,0.4);
}
.proxy-dot.ok   { background: #4CAF50; box-shadow: 0 0 6px rgba(76,175,80,0.7); }
.proxy-dot.fail { background: #f44336; box-shadow: 0 0 6px rgba(244,67,54,0.7); }
</style>
</head>
<body>
<h1>Motor &amp; Brush Control</h1>

<!-- Proxy status -->
<div class="proxy-status" id="proxyStatus">
  <div class="proxy-dot" id="proxyDot"></div>
  <span id="proxyLabel">Checking local proxy…</span>
</div>

<!-- IP -->
<div class="card">
  <label>Device IP Address</label>
  <input id="ip" type="text" class="ip-input" placeholder="e.g. 192.168.4.1">
</div>

<!-- Drive Motor -->
<div class="card">
  <h2>Drive Motor</h2>
  <label>Speed: <span class="speed-val" id="driveVal">128</span></label>
  <input id="driveRange" type="range" min="0" max="255" value="128"
         oninput="document.getElementById('driveVal').textContent=this.value">
  <div class="btn-row">
    <button onclick="send('fm', driveRange.value)">Forward</button>
    <button onclick="send('rm', driveRange.value)">Reverse</button>
    <button class="stop-btn" onclick="sendStop('b')">Stop</button>
  </div>
</div>

<!-- Brush -->
<div class="card">
  <h2>Brush</h2>
  <label>Speed: <span class="speed-val" id="brushVal">128</span></label>
  <input id="brushRange" type="range" min="0" max="255" value="128"
         oninput="document.getElementById('brushVal').textContent=this.value">
  <div class="btn-row">
    <button onclick="send('fb', brushRange.value)">Forward</button>
    <button onclick="send('rb', brushRange.value)">Reverse</button>
    <button class="stop-btn" onclick="sendStop('s')">Stop</button>
  </div>
</div>

<!-- Linear Actuator -->
<div class="card">
  <h2>Linear Actuator</h2>
  <label>Speed: <span class="speed-val" id="actVal">128</span></label>
  <input id="actRange" type="range" min="0" max="255" value="128"
         oninput="document.getElementById('actVal').textContent=this.value">
  <div class="btn-row">
    <button onclick="send('fl', actRange.value)">Forward</button>
    <button onclick="send('rl', actRange.value)">Reverse</button>
    <button class="stop-btn" onclick="sendStop('p')">Stop</button>
  </div>
</div>

<!-- Log -->
<div class="log" id="log">
  <h2>Command Log</h2>
</div>

<script>
const PROXY = 'http://localhost:8080';

// ── Proxy health check ──────────────────────────────────────────────────────
async function checkProxy() {
  const dot   = document.getElementById('proxyDot');
  const label = document.getElementById('proxyLabel');
  try {
    const res = await fetch(`${PROXY}/health`, { signal: AbortSignal.timeout(2000) });
    if (res.ok) {
      dot.className   = 'proxy-dot ok';
      label.textContent = 'Local proxy running — ready to send commands';
      return true;
    }
  } catch (_) {}
  dot.className   = 'proxy-dot fail';
  label.textContent = 'Local proxy not running — start it with: node proxy.js';
  return false;
}

// Check on load, then every 5 s
checkProxy();
setInterval(checkProxy, 5000);

// ── Logging ─────────────────────────────────────────────────────────────────
function addLogEntry(text, success = true) {
  const log   = document.getElementById('log');
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.style.color = success ? '#7CFC00' : '#FF6347';
  entry.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

// ── Core fetch — all requests go through the local proxy ────────────────────
async function sendCmd(ip, cmd) {
  const url = `${PROXY}/proxy?ip=${encodeURIComponent(ip)}&cmd=${encodeURIComponent(cmd)}`;
  const res = await fetch(url, { signal: AbortSignal.timeout(6000) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
}

async function send(prefix, val) {
  const ip = document.getElementById('ip').value.trim();
  if (!ip) { addLogEntry('No IP set', false); return; }
  const cmd = prefix + val;
  addLogEntry(`Sending ${cmd} to ${ip} …`);
  try {
    await sendCmd(ip, cmd);
    addLogEntry(`✓ Sent ${cmd}`);
  } catch (e) {
    const hint = e.message.includes('fetch') ? ' (is the proxy running? node proxy.js)' : '';
    addLogEntry(`✗ Failed: ${e.message}${hint}`, false);
    checkProxy();
  }
}

async function sendStop(stopCmd) {
  const ip = document.getElementById('ip').value.trim();
  if (!ip) { addLogEntry('No IP set', false); return; }
  addLogEntry(`Sending stop (${stopCmd}) to ${ip} …`);
  try {
    await sendCmd(ip, stopCmd);
    addLogEntry(`✓ Sent stop (${stopCmd})`);
  } catch (e) {
    const hint = e.message.includes('fetch') ? ' (is the proxy running? node proxy.js)' : '';
    addLogEntry(`✗ Failed: ${e.message}${hint}`, false);
    checkProxy();
  }
}
</script>
</body>
</html>
